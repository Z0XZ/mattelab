<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{tittel_full}}</title>
<meta name="description" content="{{beskrivelse}}">
<link rel="icon" href="{{rot}}statisk/ikon.svg" type="image/svg+xml">
<script>
  /* Settes før siden tegnes, så det ikke blinker ved mørk modus. */
  document.documentElement.classList.add("js");
  try {
    var t = localStorage.getItem("mattelab.tema");
    if (t === "lys" || t === "mork") document.documentElement.dataset.tema = t;
    if (localStorage.getItem("mattelab.tavle") === "1") document.documentElement.classList.add("tavle");
  } catch (e) {}
</script>
<link rel="stylesheet" href="{{rot}}statisk/lib/katex/katex.min.css">
<link rel="stylesheet" href="{{rot}}statisk/css/stil.css">
</head>
<body data-side="{{side_id}}">
  <a class="hopp" href="#innhold">Hopp til innholdet</a>
  <header class="topp">
    <div class="ramme">
      <a class="logo" href="{{rot}}index.html">mattelab<span>.no</span></a>
      <nav aria-label="Hovedmeny"><ul class="meny">
{{meny}}
      </ul></nav>
      <div class="verktoy">
        <select id="fagvalg" class="fag-valg" aria-label="Vis innhold for faget" title="Vis innhold for faget" hidden>
          <option value="">Alle fag</option>
{{fagvalg}}
        </select>
        <button id="tavleknapp" class="tema-knapp" type="button" aria-pressed="false" aria-label="Tavlemodus: større tekst" title="Tavlemodus: større tekst" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20l4-4 4 4M7 9h6M7 12h4"/></svg>
        </button>
        <button id="temaknapp" class="tema-knapp" type="button" aria-label="Bytt mellom lys og mørk modus" hidden>
          <svg class="ikon-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
          <svg class="ikon-mane" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="innhold">
{{innhold}}
  </main>
  <footer class="bunn">
    <div class="ramme">
      <span>© 2026 mattelab.no</span>
      <span>Ingen innlogging, informasjonskapsler eller sporing.</span>
      <span>Søsterside: <a href="https://fysikklab.no">fysikklab.no</a></span>
    </div>
  </footer>
  <script type="module" src="{{rot}}statisk/js/felles.js"></script>
{{skript}}
</body>
</html>
